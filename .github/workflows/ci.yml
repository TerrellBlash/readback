# Lints and runs the offline test suite on every push and pull request.
# image.yml also calls this workflow, so an image is only published for a
# commit that passed it. Live tests stay off: no OPENAI_API_KEY is set.
name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as docker-compose.yml, so the Postgres
      # checkpointer tests run instead of being skipped.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docagent
          POSTGRES_PASSWORD: docagent
          POSTGRES_DB: docagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches the Dockerfile
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -rs
        env:
          DATABASE_URL: postgresql://docagent:docagent@localhost:5432/docagent
